name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` runs `nuxt prepare` via postinstall, which generates .nuxt —
      # both the ESLint config and the typecheck need it.
      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm test

      # Catches what the checks above cannot: Nitro bundling, the icon bundles and
      # the Tailwind build. Note @nuxt/image bakes platform-specific sharp binaries
      # into .output, so a build made here only runs on linux-x64.
      - run: npm run build
